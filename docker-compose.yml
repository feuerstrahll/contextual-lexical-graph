services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://graph:graph@postgres:5432/lexical_graph
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: lexical_graph
      POSTGRES_USER: graph
      POSTGRES_PASSWORD: graph
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graph -d lexical_graph"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
